# AudioMaster — Release Builds
#
# Triggers on version tags (e.g. v1.0.0).
# Builds:
#   1. Tauri desktop app (.dmg, .msi, .deb/.AppImage)
#   2. CLI binaries for all platforms
#
# To use:
#   git tag v1.0.0
#   git push origin v1.0.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality-gate:
    name: Production Quality Gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: brew install ffmpeg
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

  # -----------------------------------------------------------------------
  #  Tauri desktop app (macOS, Windows, Linux)
  # -----------------------------------------------------------------------
  tauri-build:
    name: Tauri (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # tauri-action updates one GitHub release; serialize platforms to avoid
      # duplicate draft releases and lost assets.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            experimental: false
          - platform: ubuntu-22.04
            args: ""
            experimental: true
          - platform: windows-latest
            args: ""
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    needs: quality-gate

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev ffmpeg

      - name: Install macOS media dependency
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: Install Windows media dependency
        if: matrix.platform == 'windows-latest'
        run: choco install ffmpeg --no-progress -y

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Run tests
        run: cargo test --workspace

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AudioMaster ${{ github.ref_name }}"
          releaseBody: "See the [README](https://github.com/KEYHAN-A/AudioMaster/blob/main/README.md) for details."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # -----------------------------------------------------------------------
  #  CLI binary builds
  # -----------------------------------------------------------------------
  cli-build:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mastering-cli-macos-arm64
            experimental: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mastering-cli-macos-x64
            experimental: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mastering-cli-linux-x64
            experimental: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mastering-cli-windows-x64
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    needs: quality-gate

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI (release)
        run: cargo build --release --target ${{ matrix.target }} -p mastering-cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/mastering
            target/${{ matrix.target }}/release/mastering.exe
          if-no-files-found: ignore

  supply-chain:
    name: SBOM and checksums
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: audiomaster-sbom.cdx.json
      - name: Generate dependency notices
        run: |
          node scripts/generate-notices.mjs THIRD_PARTY_NOTICES.md
          cargo metadata --format-version 1 > rust-dependencies.json
          npm ls --all --json > npm-dependencies.json
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            audiomaster-sbom.cdx.json
            rust-dependencies.json
            npm-dependencies.json
            THIRD_PARTY_NOTICES.md
